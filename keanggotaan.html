<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forkomtiknas.id — Keanggotaan</title>
  <meta name="description" content="Daftarkan diri sebagai anggota Forkomtiknas — akses publikasi eksklusif, jaringan profesional TI Kesehatan, dan direktori pakar nasional." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'] },
        extend: {
          colors: {
            primary: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' },
            teal:    { 400:'#2dd4bf', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e' },
          },
          animation: {
            'fade-in': 'fadeIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards',
            'slide-up':'slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards',
          },
          keyframes: {
            fadeIn:  { '0%':{ opacity:'0', transform:'translateY(10px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
            slideUp: { '0%':{ opacity:'0', transform:'translateY(20px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { touch-action: manipulation; }
    button, a { min-height: 44px; display: inline-flex; align-items: center; }
    body { -webkit-font-smoothing: antialiased; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const IconBase = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
           strokeLinejoin="round" className={className}>{children}</svg>
    );
    const MenuIcon = () => <IconBase><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></IconBase>;
    const XIcon   = () => <IconBase><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;

    const NAV_LINKS = [
      { label:'Beranda',     href:'index.html' },
      { label:'Tentang',     href:'tentang.html' },
      { label:'Keanggotaan', href:'keanggotaan.html' },
      { label:'Publikasi',   href:'publikasi.html' },
      { label:'Kegiatan',    href:'kegiatan.html' },
      { label:'Berita',      href:'berita.html' },
      { label:'Kontak',      href:'kontak.html' },
    ];

    const Header = ({ activePage }) => {
      const [open, setOpen] = useState(false);
      return (
        <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16">
              <a href="index.html" className="flex items-center gap-3 min-h-0">
                <img src="logo.jpeg" alt="Forkomtiknas" className="h-12 object-contain" />
              </a>
              <nav className="hidden md:flex items-center gap-1">
                {NAV_LINKS.map(l => (
                  <a key={l.href} href={l.href}
                     className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors min-h-0 ${
                       activePage === l.href
                         ? 'bg-primary-50 text-primary-800'
                         : 'text-slate-600 hover:text-primary-800 hover:bg-slate-100'
                     }`}>{l.label}</a>
                ))}
                <a href="keanggotaan.html"
                   className="ml-2 px-4 py-2 bg-primary-800 text-white rounded-lg text-sm font-semibold hover:bg-primary-900 transition-colors min-h-0">
                  Daftar Anggota
                </a>
              </nav>
              <button onClick={() => setOpen(!open)} className="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 min-h-0">
                {open ? <XIcon /> : <MenuIcon />}
              </button>
            </div>
          </div>
          <div className={`md:hidden transition-all duration-300 overflow-hidden ${open ? 'max-h-96' : 'max-h-0'}`}>
            <div className="px-4 py-3 border-t border-slate-100 space-y-1 bg-white">
              {NAV_LINKS.map(l => (
                <a key={l.href} href={l.href}
                   className={`block px-3 py-2 rounded-lg text-sm font-medium min-h-0 ${
                     activePage === l.href ? 'bg-primary-50 text-primary-800' : 'text-slate-600'
                   }`}>{l.label}</a>
              ))}
              <a href="keanggotaan.html" className="block px-3 py-2 bg-primary-800 text-white rounded-lg text-sm font-semibold text-center mt-2 min-h-0">
                Daftar Anggota
              </a>
            </div>
          </div>
        </header>
      );
    };

    const Footer = () => (
      <footer className="bg-primary-900 text-white mt-20">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
            <div className="md:col-span-2">
              <div className="flex items-center gap-3 mb-4">
                <div className="bg-white rounded-xl p-1 flex-shrink-0">
                  <img src="logo.jpeg" alt="Forkomtiknas" className="h-10 object-contain" />
                </div>
                <div>
                  <div className="font-display font-bold text-white">Forkomtiknas.id</div>
                  <div className="text-primary-200 text-xs">Forum Komunikasi Informatika Kesehatan Nasional</div>
                </div>
              </div>
              <p className="text-slate-300 text-sm leading-relaxed max-w-sm">
                Wadah kolaborasi nasional para praktisi, akademisi, pengembang teknologi,
                dan regulator dalam mengakselerasi transformasi digital kesehatan Indonesia.
              </p>
              <div className="flex gap-2 mt-4 flex-wrap">
                {['Twitter/X','LinkedIn','YouTube','Instagram'].map(s => (
                  <a key={s} href="#" className="text-xs bg-white/10 px-3 py-1 rounded-full hover:bg-white/20 transition-colors min-h-0">{s}</a>
                ))}
              </div>
            </div>
            <div>
              <h4 className="font-semibold text-sm mb-3">Navigasi</h4>
              <ul className="space-y-2">
                {[['Beranda','index'],['Tentang Kami','tentang'],['Keanggotaan','keanggotaan'],
                  ['Publikasi','publikasi'],['Kegiatan','kegiatan'],['Berita','berita'],['Kontak','kontak']
                ].map(([label,slug]) => (
                  <li key={slug}><a href={`${slug}.html`} className="text-slate-300 text-sm hover:text-white transition-colors">{label}</a></li>
                ))}
              </ul>
            </div>
            <div>
              <h4 className="font-semibold text-sm mb-3">Kontak</h4>
              <ul className="space-y-2 text-slate-300 text-sm">
                <li>Sekretariat Forkomtiknas</li>
                <li>Gedung Kemenkes RI, Jakarta</li>
                <li>info@forkomtiknas.id</li>
                <li>+62 21 5201590</li>
              </ul>
            </div>
          </div>
          <div className="border-t border-white/10 pt-6 flex flex-col sm:flex-row justify-between items-center gap-2 text-slate-400 text-sm">
            <span>© 2026 Forkomtiknas. Seluruh hak cipta dilindungi.</span>
            <span>Kebijakan Privasi · Syarat Penggunaan</span>
          </div>
        </div>
      </footer>
    );

    // ── DATA ──────────────────────────────────────────────────────────────────
    const MANFAAT = [
      { ikon:'📚', judul:'Akses Publikasi Eksklusif', desc:'Whitepaper, panduan teknis, dan jurnal TI Kesehatan tanpa batas.' },
      { ikon:'🤝', judul:'Jaringan Profesional', desc:'Terhubung dengan 1.200+ pakar TI Kesehatan dari seluruh Indonesia.' },
      { ikon:'🎓', judul:'Pelatihan & Sertifikasi', desc:'Prioritas pendaftaran workshop, seminar, dan program sertifikasi kompetensi.' },
      { ikon:'🏅', judul:'Kartu Tanda Anggota Digital', desc:'KTA berbasis QR Code yang dapat diverifikasi secara online.' },
      { ikon:'📢', judul:'Advokasi Kebijakan', desc:'Berpartisipasi dalam perumusan kebijakan dan standar TI Kesehatan nasional.' },
      { ikon:'📰', judul:'Buletin & Newsletter', desc:'Update regulasi, berita TI Kesehatan, dan pengumuman Forkomtiknas.' },
    ];

    const JENIS_ANGGOTA = [
      { jenis:'Anggota Biasa', syarat:'Profesional TI Kesehatan aktif, memiliki SIP/STR', iuran:'Rp 500.000/tahun', warna:'border-primary-200', bg:'bg-primary-50', badge:'bg-primary-100 text-primary-700' },
      { jenis:'Anggota Institusi', syarat:'Rumah sakit, klinik, atau perusahaan TI Kesehatan', iuran:'Rp 2.000.000/tahun', warna:'border-teal-200', bg:'bg-teal-50', badge:'bg-teal-100 text-teal-700' },
      { jenis:'Anggota Akademik', syarat:'Dosen atau peneliti dari perguruan tinggi terakreditasi', iuran:'Rp 250.000/tahun', warna:'border-purple-200', bg:'bg-purple-50', badge:'bg-purple-100 text-purple-700' },
    ];

    const DIREKTORI_SAMPLE = [
      { nama:'Dr. Andika Pratama', keahlian:'Interoperabilitas FHIR', institusi:'RSUP Fatmawati', wilayah:'DKI Jakarta' },
      { nama:'Ir. Sari Dewi, M.T.', keahlian:'Sistem Informasi RS', institusi:'Siloam Hospitals', wilayah:'Jawa Barat' },
      { nama:'dr. Rizal Hakim, Sp.PD', keahlian:'Rekam Medis Elektronik', institusi:'RSUD Dr. Soetomo', wilayah:'Jawa Timur' },
      { nama:'Dr. Maya Kusumawati', keahlian:'Health Informatics', institusi:'Universitas Gadjah Mada', wilayah:'DI Yogyakarta' },
    ];

    const getInitials = (nama) => {
      return nama
        .replace(/[^a-zA-Z\s]/g, '')
        .split(' ')
        .filter(w => w.length > 0)
        .slice(0, 2)
        .map(w => w[0].toUpperCase())
        .join('');
    };

    // ── PAGE SECTIONS ─────────────────────────────────────────────────────────
    const PageHero = () => (
      <section className="bg-primary-900 text-white py-16 px-4">
        <div className="max-w-7xl mx-auto">
          <div className="text-sm text-primary-300 mb-4">
            <a href="index.html" className="hover:text-white transition-colors min-h-0">Beranda</a>
            <span className="mx-2">/</span>
            <span className="text-white">Keanggotaan</span>
          </div>
          <h1 className="font-display font-bold text-4xl sm:text-5xl mb-4">Keanggotaan Forkomtiknas</h1>
          <p className="text-primary-200 text-lg sm:text-xl max-w-2xl leading-relaxed">
            Bergabunglah dengan komunitas profesional TI Kesehatan terbesar di Indonesia dan jadilah bagian dari
            ekosistem digital kesehatan yang inklusif dan berdampak.
          </p>
        </div>
      </section>
    );

    const ManfaatSection = () => (
      <section className="max-w-7xl mx-auto px-4 mt-16">
        <h2 className="font-display font-bold text-2xl text-slate-900 mb-8">Manfaat Bergabung</h2>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          {MANFAAT.map((m, i) => (
            <div key={i} className="bg-white rounded-2xl border border-slate-200 p-6">
              <div className="text-3xl mb-3">{m.ikon}</div>
              <h3 className="font-semibold text-slate-900 mb-2">{m.judul}</h3>
              <p className="text-slate-500 text-sm leading-relaxed">{m.desc}</p>
            </div>
          ))}
        </div>
      </section>
    );

    const JenisAnggotaSection = () => (
      <section className="max-w-7xl mx-auto px-4 mt-16">
        <h2 className="font-display font-bold text-2xl text-slate-900 mb-8">Jenis Keanggotaan</h2>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          {JENIS_ANGGOTA.map((j, i) => (
            <div key={i} className={`border-2 rounded-2xl p-6 ${j.warna} ${j.bg}`}>
              <span className={`inline-flex text-sm font-semibold px-3 py-1 rounded-full mb-4 min-h-0 ${j.badge}`}>
                {j.jenis}
              </span>
              <p className="text-slate-600 text-sm leading-relaxed mb-4">{j.syarat}</p>
              <div className="font-display font-bold text-slate-900 text-xl mb-6">{j.iuran}</div>
              <button
                onClick={() => alert('Terima kasih! Silakan lengkapi formulir di bawah.')}
                className="w-full justify-center px-4 py-2.5 bg-primary-800 text-white rounded-xl text-sm font-semibold hover:bg-primary-900 transition-colors">
                Daftar Sekarang
              </button>
            </div>
          ))}
        </div>
      </section>
    );

    const FormulirSection = () => (
      <section className="max-w-3xl mx-auto px-4 mt-16">
        <h2 className="font-display font-bold text-2xl text-slate-900 text-center mb-8">Formulir Pendaftaran Online</h2>
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
          <div className="space-y-5">
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Nama Lengkap</label>
              <input type="text" placeholder="Masukkan nama lengkap Anda"
                     className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
              <input type="email" placeholder="nama@institusi.id"
                     className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">No. HP</label>
              <input type="tel" placeholder="+62 8xx xxxx xxxx"
                     className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Instansi / Organisasi</label>
              <input type="text" placeholder="Nama instansi atau organisasi"
                     className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Profesi / Jabatan</label>
              <input type="text" placeholder="Contoh: Dokter Spesialis, Manajer IT Rumah Sakit"
                     className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Jenis Keanggotaan</label>
              <select className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white">
                <option value="">Pilih jenis keanggotaan...</option>
                <option value="biasa">Anggota Biasa — Rp 500.000/tahun</option>
                <option value="institusi">Anggota Institusi — Rp 2.000.000/tahun</option>
                <option value="akademik">Anggota Akademik — Rp 250.000/tahun</option>
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Unggah Dokumen Pendukung</label>
              <input type="file" accept=".pdf,.jpg,.png"
                     className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-primary-50 file:text-primary-700" />
              <p className="text-slate-400 text-xs mt-1">Format: PDF, JPG, PNG. Maks. 5 MB. (SIP, STR, atau surat keterangan instansi)</p>
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Motivasi Bergabung</label>
              <textarea rows={4} placeholder="Ceritakan alasan Anda ingin bergabung dengan Forkomtiknas dan kontribusi yang ingin Anda berikan..."
                        className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 resize-none" />
            </div>
            <button
              onClick={() => alert('Terima kasih! Pendaftaran Anda sedang diproses. Tim kami akan menghubungi Anda dalam 3–5 hari kerja.')}
              className="w-full justify-center px-6 py-3 bg-primary-800 text-white rounded-xl font-semibold hover:bg-primary-900 transition-colors text-sm">
              Kirim Pendaftaran
            </button>
          </div>
        </div>
      </section>
    );

    const DirekoriSection = () => (
      <section className="max-w-7xl mx-auto px-4 mt-20">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
          <h2 className="font-display font-bold text-2xl text-slate-900">Direktori Anggota</h2>
          <input type="text" placeholder="Cari nama, keahlian, atau institusi..."
                 className="border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 w-full sm:w-72" />
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          {DIREKTORI_SAMPLE.map((d, i) => (
            <div key={i} className="bg-white border border-slate-200 rounded-2xl p-5">
              <div className="flex items-center gap-3 mb-3">
                <div className="bg-primary-100 text-primary-800 w-11 h-11 rounded-full flex items-center justify-center font-bold text-base flex-shrink-0">
                  {getInitials(d.nama)}
                </div>
                <div className="min-w-0">
                  <div className="font-semibold text-slate-900 text-sm leading-snug">{d.nama}</div>
                </div>
              </div>
              <span className="inline-flex bg-teal-50 text-teal-700 text-xs font-semibold px-2 py-0.5 rounded-full min-h-0 mb-3">
                {d.keahlian}
              </span>
              <div className="text-slate-500 text-xs">{d.institusi}</div>
              <div className="text-slate-400 text-xs mt-0.5">📍 {d.wilayah}</div>
            </div>
          ))}
        </div>
        <p className="text-center text-slate-500 text-sm mt-6">
          Menampilkan 4 dari 1.200+ anggota terverifikasi.{' '}
          <a href="#portal-login" className="text-primary-700 font-semibold hover:underline min-h-0">Login untuk akses direktori lengkap.</a>
        </p>
      </section>
    );

    const PortalLoginSection = () => (
      <section id="portal-login" className="max-w-md mx-auto px-4 mt-16 mb-20">
        <div className="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
          <h2 className="font-display font-bold text-xl text-slate-900 mb-6 text-center">Portal Anggota</h2>
          <div className="space-y-4">
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
              <input type="email" placeholder="email@institusi.id"
                     className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Kata Sandi</label>
              <input type="password" placeholder="••••••••"
                     className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
            </div>
            <button
              onClick={() => alert('Fitur login akan tersedia setelah akun Anda diverifikasi oleh admin.')}
              className="w-full justify-center px-6 py-3 bg-primary-800 text-white rounded-xl font-semibold hover:bg-primary-900 transition-colors text-sm">
              Masuk ke Portal
            </button>
            <div className="text-center">
              <a href="#" className="text-primary-700 text-sm hover:underline min-h-0">Lupa kata sandi?</a>
            </div>
          </div>
        </div>
      </section>
    );

    const App = () => (
      <div>
        <Header activePage="keanggotaan.html" />
        <main>
          <PageHero />
          <ManfaatSection />
          <JenisAnggotaSection />
          <FormulirSection />
          <DirekoriSection />
          <PortalLoginSection />
        </main>
        <Footer />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
