  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script>

        extend: {

            primary: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' },
            teal:    { 400:'#2dd4bf', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e' },
          },
          animation: {

            'slide-up':'slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards',
          },
          keyframes: {
            fadeIn:  { '0%':{ opacity:'0', transform:'translateY(10px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
            slideUp: { '0%':{ opacity:'0', transform:'translateY(20px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
          }

    * { touch-action: manipulation; }
    button, a { min-height: 44px; display: inline-flex; align-items: center; }

    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

<body class="bg-slate-50 font-sans text-slate-800">
  <div style="background:#f59e0b;color:#1c1917;text-align:center;padding:10px 16px;font-size:14px;font-weight:600;z-index:9999;position:relative;">

    const NAV_LINKS = [
      { label:'Beranda',     href:'index.html' },
      { label:'Tentang',     href:'tentang.html' },
      { label:'Keanggotaan', href:'keanggotaan.html' },
      { label:'Publikasi',   href:'publikasi.html' },
      { label:'Kegiatan',    href:'kegiatan.html' },
      { label:'Berita',      href:'berita.html' },
      { label:'Kontak',      href:'kontak.html' },
    ];

    const Header = ({ activePage }) => {
      const [open, setOpen] = useState(false);
      return (
        <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

              </a>
              <nav className="hidden md:flex items-center gap-1">
                {NAV_LINKS.map(l => (
                  <a key={l.href} href={l.href}
                     className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors min-h-0 ${
                       activePage === l.href
                         ? 'bg-primary-50 text-primary-800'
                         : 'text-slate-600 hover:text-primary-800 hover:bg-slate-100'
                     }`}>{l.label}</a>
                ))}

        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">

              <div className="h-40 bg-gradient-to-br from-primary-100 to-teal-100 flex items-center justify-center text-6xl">

              <div className="p-4">

    const App = () => (
      <div>

        <main>

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

</body>
</html>
