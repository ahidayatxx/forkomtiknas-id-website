<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

    button, a { min-height: 44px; display: inline-flex; align-items: center; }

<body class="bg-slate-50 font-sans text-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const IconBase = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
           strokeLinejoin="round" className={className}>{children}</svg>

    const NAV_LINKS = [
      { label:'Beranda',     href:'index.html' },
      { label:'Tentang',     href:'tentang.html' },
      { label:'Keanggotaan', href:'keanggotaan.html' },
      { label:'Publikasi',   href:'publikasi.html' },
      { label:'Kegiatan',    href:'kegiatan.html' },
      { label:'Berita',      href:'berita.html' },
      { label:'Kontak',      href:'kontak.html' },
    ];

    const Header = ({ activePage }) => {
      const [open, setOpen] = useState(false);
      return (
        <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16">
              <a href="index.html" className="flex items-center gap-3 min-h-0">
                <div className="w-9 h-9 bg-primary-900 rounded-lg flex items-center justify-center flex-shrink-0">
                  <span className="text-white font-display font-bold text-sm">Fk</span>
                </div>
                <div className="leading-tight">
                  <div className="font-display font-bold text-primary-900 text-sm">Forkomtiknas</div>
                  <div className="text-xs text-slate-500 hidden sm:block">Forum TI Kesehatan Nasional</div>
                </div>
              </a>
              <nav className="hidden md:flex items-center gap-1">
                {NAV_LINKS.map(l => (
                  <a key={l.href} href={l.href}
                     className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors min-h-0 ${
                       activePage === l.href
                         ? 'bg-primary-50 text-primary-800'
                         : 'text-slate-600 hover:text-primary-800 hover:bg-slate-100'
                     }`}>{l.label}</a>
                ))}
                <a href="keanggotaan.html"
                   className="ml-2 px-4 py-2 bg-primary-800 text-white rounded-lg text-sm font-semibold hover:bg-primary-900 transition-colors min-h-0">
                  Daftar Anggota
                </a>
              </nav>
              <button onClick={() => setOpen(!open)} className="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 min-h-0">
                {open ? <XIcon /> : <MenuIcon />}
              </button>
            </div>
          </div>
          <div className={`md:hidden transition-all duration-300 overflow-hidden ${open ? 'max-h-96' : 'max-h-0'}`}>
            <div className="px-4 py-3 border-t border-slate-100 space-y-1 bg-white">
              {NAV_LINKS.map(l => (
                <a key={l.href} href={l.href}
                   className={`block px-3 py-2 rounded-lg text-sm font-medium min-h-0 ${
                     activePage === l.href ? 'bg-primary-50 text-primary-800' : 'text-slate-600'

              ))}
              <a href="keanggotaan.html" className="block px-3 py-2 bg-primary-800 text-white rounded-lg text-sm font-semibold text-center mt-2 min-h-0">

    const Footer = () => (
      <footer className="bg-primary-900 text-white mt-20">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
            <div className="md:col-span-2">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                  <span className="font-display font-bold text-white text-sm">Fk</span>
                </div>
                <div>
                  <div className="font-display font-bold text-white">Forkomtiknas.id</div>
                  <div className="text-primary-200 text-xs">Forum Komunikasi TI Kesehatan Nasional</div>
                </div>
              </div>
              <p className="text-slate-300 text-sm leading-relaxed max-w-sm">
                Wadah kolaborasi nasional para praktisi, akademisi, pengembang teknologi,
                dan regulator dalam mengakselerasi transformasi digital kesehatan Indonesia.
              </p>
              <div className="flex gap-2 mt-4 flex-wrap">
                {['Twitter/X','LinkedIn','YouTube','Instagram'].map(s => (
                  <a key={s} href="#" className="text-xs bg-white/10 px-3 py-1 rounded-full hover:bg-white/20 transition-colors min-h-0">{s}</a>
                ))}
              </div>
            </div>
            <div>
              <h4 className="font-semibold text-sm mb-3">Navigasi</h4>
              <ul className="space-y-2">
                {[['Beranda','index'],['Tentang Kami','tentang'],['Keanggotaan','keanggotaan'],
                  ['Publikasi','publikasi'],['Kegiatan','kegiatan'],['Berita','berita'],['Kontak','kontak']
                ].map(([label,slug]) => (
                  <li key={slug}><a href={`${slug}.html`} className="text-slate-300 text-sm hover:text-white transition-colors">{label}</a></li>
                ))}
              </ul>
            </div>
            <div>
              <h4 className="font-semibold text-sm mb-3">Kontak</h4>
              <ul className="space-y-2 text-slate-300 text-sm">
                <li>Sekretariat Forkomtiknas</li>
                <li>Gedung Kemenkes RI, Jakarta</li>
                <li>info@forkomtiknas.id</li>
                <li>+62 21 5201590</li>
              </ul>
            </div>
          </div>
          <div className="border-t border-white/10 pt-6 flex flex-col sm:flex-row justify-between items-center gap-2 text-slate-400 text-sm">
            <span>© 2026 Forkomtiknas. Seluruh hak cipta dilindungi.</span>
            <span>Kebijakan Privasi · Syarat Penggunaan</span>
          </div>
        </div>
      </footer>
    );

    // ── DATA ──────────────────────────────────────────────────────────────────
    const MITRA = [
      'Kementerian Kesehatan RI', 'BPJS Kesehatan', 'Kominfo RI',
      'Ikatan Dokter Indonesia (IDI)', 'Persatuan Perawat Nasional Indonesia (PPNI)',
      'Monash University Indonesia', 'UI Fakultas Kedokteran', 'RSUP Dr. Cipto Mangunkusumo',
    ];

    const PENGURUS = [
      { nama:'Dr. Budi Santoso, M.Kes', jabatan:'Ketua Umum', institusi:'RSUP Dr. Sardjito Yogyakarta' },
      { nama:'dr. Siti Rahayu, Sp.KJ', jabatan:'Wakil Ketua I', institusi:'Kemenkes RI' },
      { nama:'Ir. Ahmad Fauzi, M.T.', jabatan:'Sekretaris Jenderal', institusi:'Kominfo RI' },
      { nama:'Dr. Rina Kusuma, S.Farm', jabatan:'Bendahara Umum', institusi:'BPJS Kesehatan' },
      { nama:'Prof. Hendra Wijaya, Ph.D', jabatan:'Ketua Bidang Riset', institusi:'Universitas Indonesia' },
      { nama:'dr. Dewi Lestari, M.Biomed', jabatan:'Ketua Bidang Keanggotaan', institusi:'IDI Pusat' },
    ];

    // ── PAGE SECTIONS ─────────────────────────────────────────────────────────
    const PageHero = () => (
      <section className="bg-primary-900 text-white py-16 px-4">
        <div className="max-w-7xl mx-auto">
          <div className="text-sm text-primary-300 mb-4">
            <a href="index.html" className="hover:text-white transition-colors min-h-0">Beranda</a>
            <span className="mx-2">/</span>
            <span className="text-white">Tentang Kami</span>
          </div>
          <h1 className="font-display font-bold text-4xl sm:text-5xl mb-4">Tentang Forkomtiknas</h1>
          <p className="text-primary-200 text-lg sm:text-xl max-w-2xl leading-relaxed">
            Membangun ekosistem TI Kesehatan nasional yang inklusif, inovatif, dan berstandar internasional.
          </p>
        </div>
      </section>
    );

    const ProfilSection = () => (
      <section className="max-w-7xl mx-auto px-4 mt-16">
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
          <div>
            <h2 className="font-display font-bold text-2xl text-slate-900 mb-6">Latar Belakang &amp; Profil</h2>
            <div className="space-y-4 text-slate-600 leading-relaxed">
              <p>
                Forkomtiknas didirikan pada tahun 2018 sebagai respons atas kebutuhan mendesak akan sebuah wadah
                koordinasi lintas sektor di bidang Teknologi Informasi Kesehatan Indonesia. Berdiri di era awal
                transformasi digital layanan kesehatan nasional, forum ini hadir untuk menjembatani para pemangku
                kepentingan — dari klinisi, pengembang sistem, akademisi, hingga regulator — dalam satu ekosistem
                kolaboratif yang terstruktur.
              </p>
              <p>
                Misi utama Forkomtiknas adalah mendorong penerapan standar TI Kesehatan yang konsisten, mendukung
                interoperabilitas sistem informasi di seluruh fasilitas pelayanan kesehatan, dan menjadi pusat
                referensi kebijakan serta praktik terbaik di bidang informatika kesehatan. Melalui berbagai program
                pelatihan, seminar nasional, dan publikasi ilmiah, Forkomtiknas berkontribusi langsung pada
                peningkatan kompetensi SDM digital kesehatan Indonesia.
              </p>
              <p>
                Dengan jangkauan nasional yang mencakup lebih dari 34 provinsi, Forkomtiknas telah menjadi mitra
                strategis Kementerian Kesehatan RI dalam pelaksanaan program SATUSEHAT, standardisasi HL7 FHIR,
                serta penguatan tata kelola data kesehatan. Forum ini terus berkembang sebagai komunitas profesional
                yang berkomitmen pada kemajuan ekosistem digital kesehatan Indonesia menuju standar internasional.
              </p>
            </div>
          </div>
          <div className="bg-primary-50 rounded-2xl p-6">
            <h3 className="font-display font-semibold text-primary-900 text-lg mb-6">Forkomtiknas dalam Angka</h3>
            <div className="space-y-4">
              {[
                { label:'Anggota Aktif', nilai:'1.200+' },
                { label:'Dokumen &amp; Publikasi', nilai:'450+' },
                { label:'Kegiatan per Tahun', nilai:'24+' },
                { label:'Tahun Berdiri', nilai:'8 Tahun' },
              ].map(s => (
                <div key={s.label} className="flex items-center justify-between py-3 border-b border-primary-100 last:border-0">
                  <span className="text-slate-600 text-sm" dangerouslySetInnerHTML={{ __html: s.label }} />
                  <span className="font-display font-bold text-primary-900 text-xl">{s.nilai}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>
    );

    const VisiMisiSection = () => (
      <section className="bg-white py-16 mt-16">
        <div className="max-w-7xl mx-auto px-4">
          <h2 className="font-display font-bold text-2xl text-slate-900 text-center mb-10">Visi &amp; Misi</h2>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div className="border-l-4 border-primary-800 bg-primary-50 rounded-2xl p-8">
              <div className="text-4xl mb-4">🎯</div>
              <h3 className="font-display font-bold text-xl text-primary-900 mb-4">Visi</h3>
              <p className="text-slate-700 leading-relaxed">
                Menjadi forum komunikasi TI Kesehatan nasional terdepan yang mewujudkan ekosistem digital kesehatan
                Indonesia yang inklusif, terintegrasi, berdaya saing global, dan berorientasi pada keselamatan
                serta kualitas pelayanan kesehatan bagi seluruh rakyat Indonesia.
              </p>
            </div>
            <div className="border-l-4 border-teal-600 bg-teal-50 rounded-2xl p-8">
              <div className="text-4xl mb-4">🚀</div>
              <h3 className="font-display font-bold text-xl text-teal-800 mb-4">Misi</h3>
              <ul className="space-y-3">
                {[
                  'Membangun kolaborasi inklusif antara praktisi, akademisi, pengembang teknologi, dan regulator TI Kesehatan nasional.',
                  'Mendorong standarisasi dan interoperabilitas sistem informasi kesehatan sesuai standar internasional (HL7 FHIR, SNOMED CT, ICD).',
                  'Mengakselerasi transformasi digital layanan kesehatan melalui peningkatan kompetensi SDM dan diseminasi praktik terbaik.',
                  'Mengadvokasi kebijakan TI Kesehatan yang progresif, berbasis bukti, dan berorientasi kepada kepentingan publik.',
                ].map((m, i) => (
                  <li key={i} className="flex gap-3 text-slate-700 text-sm leading-relaxed">
                    <span className="flex-shrink-0 w-5 h-5 bg-teal-600 text-white rounded-full flex items-center justify-center text-xs font-bold mt-0.5">{i + 1}</span>
                    {m}
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </div>
      </section>
    );

    const getInitials = (nama) => {
      return nama
        .replace(/[^a-zA-Z\s]/g, '')
        .split(' ')
        .filter(w => w.length > 0)
        .slice(0, 2)
        .map(w => w[0].toUpperCase())
        .join('');
    };

    const StrukturOrganisasiSection = () => (
      <section className="max-w-7xl mx-auto px-4 mt-16">
        <h2 className="font-display font-bold text-2xl text-slate-900 mb-8">Struktur Organisasi</h2>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          {PENGURUS.map((p, i) => (
            <div key={i} className="bg-white rounded-2xl border border-slate-200 p-6">
              <div className="flex items-center gap-4 mb-4">
                <div className="bg-primary-100 text-primary-800 w-14 h-14 rounded-full flex items-center justify-center font-bold text-lg flex-shrink-0">
                  {getInitials(p.nama)}
                </div>
                <div className="min-w-0">
                  <div className="font-semibold text-slate-900 text-sm leading-snug">{p.nama}</div>
                </div>
              </div>
              <span className="inline-flex bg-primary-50 text-primary-700 text-xs font-semibold px-2 py-0.5 rounded-full min-h-0 mb-3">
                {p.jabatan}
              </span>
              <div className="text-slate-500 text-xs mt-1">{p.institusi}</div>
            </div>

    const ADARTSection = () => (
      <section className="max-w-7xl mx-auto px-4 mt-16">
        <div className="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-8 flex flex-col sm:flex-row gap-6 items-center">
          <div className="flex-1">
            <div className="text-5xl mb-4">📜</div>
            <h2 className="font-display font-bold text-xl text-white mb-3">
              Anggaran Dasar &amp; Anggaran Rumah Tangga (AD/ART)
            </h2>
            <p className="text-slate-300 text-sm leading-relaxed mb-2">
              Dokumen resmi yang mengatur tata kelola, hak, dan kewajiban anggota Forkomtiknas.
            </p>
            <p className="text-slate-400 text-xs">Diterbitkan 2018 · Revisi terakhir 2024</p>
          </div>
          <div className="flex-shrink-0">
            <button
              onClick={() => alert('Mengunduh AD/ART Forkomtiknas...')}
              className="px-6 py-3 bg-white text-slate-900 rounded-xl font-semibold hover:bg-slate-100 transition-colors">
              Unduh AD/ART (PDF)
            </button>
          </div>
        </div>

    );

    const MitraSection = () => (

        <h2 className="font-display font-bold text-2xl text-slate-900 mb-8">Mitra Kerja Sama</h2>
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
          {MITRA.map((m, i) => (
            <div key={i}
                 className="bg-white border border-slate-200 rounded-xl px-4 py-4 text-center text-sm font-medium text-slate-700 hover:border-primary-200 hover:bg-primary-50 transition-colors">
              {m}
            </div>
          ))}
        </div>
      </section>
    );

    const App = () => (
      <div>
        <Header activePage="tentang.html" />
        <main>
          <PageHero />
          <ProfilSection />
          <VisiMisiSection />
          <StrukturOrganisasiSection />
          <ADARTSection />
          <MitraSection />
        </main>
        <Footer />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
