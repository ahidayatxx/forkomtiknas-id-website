<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forkomtiknas.id — Beranda</title>
  <meta name="description" content="Portal resmi Forum Komunikasi Teknologi Informasi Kesehatan Nasional — pusat informasi, kolaborasi, dan publikasi TI Kesehatan Indonesia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'] },
        extend: {
          colors: {
            primary: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' },

            'slide-up':'slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards',
          },
          keyframes: {
            fadeIn:  { '0%':{ opacity:'0', transform:'translateY(10px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
            slideUp: { '0%':{ opacity:'0', transform:'translateY(20px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { touch-action: manipulation; }
    button, a { min-height: 44px; display: inline-flex; align-items: center; }
    body { -webkit-font-smoothing: antialiased; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <div id="root"></div>
  <script type="text/babel">

    const IconBase = ({ children, className }) => (

           strokeLinejoin="round" className={className}>{children}</svg>

    const MenuIcon = () => <IconBase><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></IconBase>;

      { label:'Tentang',     href:'tentang.html' },
      { label:'Keanggotaan', href:'keanggotaan.html' },
      { label:'Publikasi',   href:'publikasi.html' },
      { label:'Kegiatan',    href:'kegiatan.html' },
      { label:'Berita',      href:'berita.html' },
      { label:'Kontak',      href:'kontak.html' },
    ];

    const Header = ({ activePage }) => {
      const [open, setOpen] = useState(false);
      return (
        <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16">
              <a href="index.html" className="flex items-center gap-3 min-h-0">
                <div className="w-9 h-9 bg-primary-900 rounded-lg flex items-center justify-center flex-shrink-0">
                  <span className="text-white font-display font-bold text-sm">Fk</span>
                </div>
                <div className="leading-tight">
                  <div className="font-display font-bold text-primary-900 text-sm">Forkomtiknas</div>
                  <div className="text-xs text-slate-500 hidden sm:block">Forum TI Kesehatan Nasional</div>
                </div>
              </a>
              <nav className="hidden md:flex items-center gap-1">
                {NAV_LINKS.map(l => (
                  <a key={l.href} href={l.href}
                     className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors min-h-0 ${
                       activePage === l.href
                         ? 'bg-primary-50 text-primary-800'
                         : 'text-slate-600 hover:text-primary-800 hover:bg-slate-100'
                     }`}>{l.label}</a>
                ))}

                </a>
              </nav>
              <button onClick={() => setOpen(!open)} className="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 min-h-0">

              <ul className="space-y-2 text-slate-300 text-sm">
                <li>Sekretariat Forkomtiknas</li>
                <li>Gedung Kemenkes RI, Jakarta</li>
                <li>info@forkomtiknas.id</li>
                <li>+62 21 5201590</li>
              </ul>
            </div>
          </div>
          <div className="border-t border-white/10 pt-6 flex flex-col sm:flex-row justify-between items-center gap-2 text-slate-400 text-sm">

            <span>Kebijakan Privasi · Syarat Penggunaan</span>
          </div>
        </div>
      </footer>

          <span className="inline-flex bg-white/20 text-white text-xs font-semibold px-4 py-1 rounded-full mb-6 tracking-wide uppercase">
            Portal Resmi Forkomtiknas

          <p className="text-primary-100 text-lg sm:text-xl max-w-2xl mx-auto mb-10 leading-relaxed">

            akademisi, dan regulator untuk mengakselerasi ekosistem digital kesehatan Indonesia.

          <div className="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="keanggotaan.html" className="px-8 py-3 bg-white text-primary-900 rounded-xl font-semibold hover:bg-primary-50 transition-colors justify-center">

    const StatsBar = () => (

          <div className="grid grid-cols-2 md:grid-cols-4 divide-x divide-slate-100">
            {STATS.map(s => (

        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          {BERITA.map(b => (
            <article key={b.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-md transition-shadow flex flex-col">

                <span className="text-5xl">🏥</span>
              </div>
              <div className="p-5 flex flex-col flex-1">
                <div className="flex items-center gap-2 mb-3">
                  <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${b.warna}`}>{b.kategori}</span>

                <h3 className="font-semibold text-slate-900 leading-snug mb-2 line-clamp-2">{b.judul}</h3>
                <p className="text-slate-500 text-sm line-clamp-3 flex-1">{b.excerpt}</p>

          ))}

          <h2 className="font-display font-bold text-2xl text-slate-900">Dokumen Unggulan</h2>

    const CTAKeanggotaanSection = () => (

        <div className="bg-gradient-to-r from-primary-900 to-teal-700 rounded-3xl p-10 text-center text-white">

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
