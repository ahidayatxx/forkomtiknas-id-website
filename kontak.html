<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forkomtiknas.id — Kontak & Layanan</title>
  <meta name="description" content="Portal resmi Forum Komunikasi Teknologi Informasi Kesehatan Nasional — pusat informasi, kolaborasi, dan publikasi TI Kesehatan Indonesia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'] },
        extend: {
          colors: {
            primary: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' },
            teal:    { 400:'#2dd4bf', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e' },
          },
          animation: {
            'fade-in': 'fadeIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards',
            'slide-up':'slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards',
          },
          keyframes: {
            fadeIn:  { '0%':{ opacity:'0', transform:'translateY(10px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
            slideUp: { '0%':{ opacity:'0', transform:'translateY(20px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { touch-action: manipulation; }
    button, a { min-height: 44px; display: inline-flex; align-items: center; }
    body { -webkit-font-smoothing: antialiased; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <div style="background:#f59e0b;color:#1c1917;text-align:center;padding:10px 16px;font-size:14px;font-weight:600;z-index:9999;position:relative;">
    ⚠️ WEBSITE DEMO — Konten pada halaman ini adalah contoh ilustratif dan tidak mencerminkan informasi aktual Forkomtiknas.
  </div>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const IconBase = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
           strokeLinejoin="round" className={className}>{children}</svg>
    );
    const MenuIcon = () => <IconBase><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></IconBase>;
    const XIcon   = () => <IconBase><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;

    const NAV_LINKS = [
      { label:'Beranda',     href:'index.html' },
      { label:'Tentang',     href:'tentang.html' },
      { label:'Keanggotaan', href:'keanggotaan.html' },
      { label:'Publikasi',   href:'publikasi.html' },
      { label:'Kegiatan',    href:'kegiatan.html' },
      { label:'Berita',      href:'berita.html' },
      { label:'Kontak',      href:'kontak.html' },
    ];

    const Header = ({ activePage }) => {
      const [open, setOpen] = useState(false);
      return (
        <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16">
              <a href="index.html" className="flex items-center gap-3 min-h-0">
                <img src="logo.jpeg" alt="Forkomtiknas" className="h-12 object-contain" />
              </a>
              <nav className="hidden md:flex items-center gap-1">
                {NAV_LINKS.map(l => (
                  <a key={l.href} href={l.href}
                     className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors min-h-0 ${
                       activePage === l.href
                         ? 'bg-primary-50 text-primary-800'
                         : 'text-slate-600 hover:text-primary-800 hover:bg-slate-100'
                     }`}>{l.label}</a>
                ))}
                <a href="keanggotaan.html"
                   className="ml-2 px-4 py-2 bg-primary-800 text-white rounded-lg text-sm font-semibold hover:bg-primary-900 transition-colors min-h-0">
                  Daftar Anggota
                </a>
              </nav>
              <button onClick={() => setOpen(!open)} className="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 min-h-0">
                {open ? <XIcon /> : <MenuIcon />}
              </button>
            </div>
          </div>
          <div className={`md:hidden transition-all duration-300 overflow-hidden ${open ? 'max-h-96' : 'max-h-0'}`}>
            <div className="px-4 py-3 border-t border-slate-100 space-y-1 bg-white">
              {NAV_LINKS.map(l => (
                <a key={l.href} href={l.href}
                   className={`block px-3 py-2 rounded-lg text-sm font-medium min-h-0 ${
                     activePage === l.href ? 'bg-primary-50 text-primary-800' : 'text-slate-600'
                   }`}>{l.label}</a>
              ))}
              <a href="keanggotaan.html" className="block px-3 py-2 bg-primary-800 text-white rounded-lg text-sm font-semibold text-center mt-2 min-h-0">
                Daftar Anggota
              </a>
            </div>
          </div>
        </header>
      );
    };

    const Footer = () => (
      <footer className="bg-primary-900 text-white mt-20">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
            <div className="md:col-span-2">
              <div className="flex items-center gap-3 mb-4">
                <div className="bg-white rounded-xl p-1 flex-shrink-0">
                  <img src="logo.jpeg" alt="Forkomtiknas" className="h-10 object-contain" />
                </div>
                <div>
                  <div className="font-display font-bold text-white">Forkomtiknas.id</div>
                  <div className="text-primary-200 text-xs">Forum Komunikasi Informatika Kesehatan Nasional</div>
                </div>
              </div>
              <p className="text-slate-300 text-sm leading-relaxed max-w-sm">
                Wadah kolaborasi nasional para praktisi, akademisi, pengembang teknologi,
                dan regulator dalam mengakselerasi transformasi digital kesehatan Indonesia.
              </p>
              <div className="flex gap-2 mt-4 flex-wrap">
                {['Twitter/X','LinkedIn','YouTube','Instagram'].map(s => (
                  <a key={s} href="#" className="text-xs bg-white/10 px-3 py-1 rounded-full hover:bg-white/20 transition-colors min-h-0">{s}</a>
                ))}
              </div>
            </div>
            <div>
              <h4 className="font-semibold text-sm mb-3">Navigasi</h4>
              <ul className="space-y-2">
                {[['Beranda','index'],['Tentang Kami','tentang'],['Keanggotaan','keanggotaan'],
                  ['Publikasi','publikasi'],['Kegiatan','kegiatan'],['Berita','berita'],['Kontak','kontak']
                ].map(([label,slug]) => (
                  <li key={slug}><a href={`${slug}.html`} className="text-slate-300 text-sm hover:text-white transition-colors">{label}</a></li>
                ))}
              </ul>
            </div>
            <div>
              <h4 className="font-semibold text-sm mb-3">Kontak</h4>
              <ul className="space-y-2 text-slate-300 text-sm">
                <li>Sekretariat Forkomtiknas</li>
                <li>[Alamat Sekretariat]</li>
                <li>email@contoh.com</li>
                <li>+62 xx xxxx-xxxx</li>
              </ul>
            </div>
          </div>
          <div className="border-t border-white/10 pt-6 flex flex-col sm:flex-row justify-between items-center gap-2 text-slate-400 text-sm">
            <span>© 2026 Forkomtiknas. Seluruh hak cipta dilindungi.</span>
            <span>Kebijakan Privasi · Syarat Penggunaan</span>
          </div>
        </div>
      </footer>
    );

    // ── DATA ──────────────────────────────────────────────────────────────────
    const FAQ_ITEMS = [
      { q:'Bagaimana cara mendaftar sebagai anggota Forkomtiknas?', a:'Isi formulir pendaftaran online di halaman Keanggotaan. Tim kami akan memverifikasi dokumen Anda dalam 3–5 hari kerja.' },
      { q:'Apakah semua kegiatan Forkomtiknas gratis untuk anggota?', a:'Sebagian besar kegiatan gratis atau bersubsidi untuk anggota aktif. Kegiatan berbayar memberikan diskon minimal 50% untuk anggota.' },
      { q:'Bagaimana cara mengirimkan karya ilmiah untuk dipublikasikan?', a:'Kirimkan naskah Anda ke [email publikasi] dengan format sesuai panduan penulisan yang tersedia di halaman Publikasi.' },
      { q:'Apakah ada program keanggotaan untuk mahasiswa?', a:'Saat ini kami belum memiliki kategori khusus mahasiswa, namun anggota akademik dari perguruan tinggi dapat mendaftarkan mahasiswa binaan mereka secara kolektif.' },
      { q:'Bagaimana cara mendapatkan e-sertifikat dari kegiatan Forkomtiknas?', a:'E-sertifikat diterbitkan otomatis dan dikirimkan ke email terdaftar dalam 1–2 hari kerja setelah acara berakhir.' },
    ];

    const KANAL_KONTAK = [
      { ikon:'📧', label:'Email Umum', nilai:'email@contoh.com' },
      { ikon:'📞', label:'Telepon Sekretariat', nilai:'+62 xx xxxx-xxxx' },
      { ikon:'📍', label:'Alamat', nilai:'[Alamat Sekretariat Forkomtiknas]' },
      { ikon:'🕐', label:'Jam Operasional', nilai:'[Hari], [Jam] WIB' },
    ];

    // ── PAGE SECTIONS ─────────────────────────────────────────────────────────
    const PageHero = () => (
      <section className="bg-gradient-to-br from-primary-900 via-primary-800 to-primary-700 text-white py-16 px-4">
        <div className="max-w-7xl mx-auto">
          <div className="text-sm text-primary-200 mb-4">
            <a href="index.html" className="hover:text-white transition-colors min-h-0">Beranda</a>
            <span className="mx-2">/</span>
            <span className="text-white">Kontak &amp; Layanan</span>
          </div>
          <h1 className="font-display font-bold text-3xl sm:text-4xl mb-3 animate-fade-in">Kontak &amp; Layanan</h1>
          <p className="text-primary-100 max-w-2xl leading-relaxed">
            Hubungi sekretariat Forkomtiknas atau temukan jawaban atas pertanyaan Anda
            melalui halaman ini.
          </p>
        </div>
      </section>
    );

    const FormulirKontak = () => {
      const handleSubmit = (e) => {
        e.preventDefault();
        alert('Pesan Anda telah terkirim! Tim kami akan merespons dalam 1–2 hari kerja.');
      };
      return (
        <div className="bg-white rounded-2xl border border-slate-200 p-8">
          <h2 className="font-display font-bold text-xl text-slate-900 mb-6">Kirim Pesan</h2>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Nama Lengkap</label>
              <input
                type="text"
                required
                placeholder="Masukkan nama lengkap Anda"
                className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
              <input
                type="email"
                required
                placeholder="nama@contoh.com"
                className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Subjek</label>
              <input
                type="text"
                required
                placeholder="Topik pesan Anda"
                className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1.5">Pesan</label>
              <textarea
                rows={5}
                required
                placeholder="Tuliskan pesan Anda di sini..."
                className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 resize-none"
              />
            </div>
            <button
              type="submit"
              className="w-full justify-center px-6 py-3 bg-primary-800 text-white rounded-xl text-sm font-semibold hover:bg-primary-900 transition-colors min-h-0"
            >
              Kirim Pesan
            </button>
          </form>
        </div>
      );
    };

    const KontakSection = () => (
      <section className="max-w-7xl mx-auto px-4 mt-16">
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
          {/* Left — contact form */}
          <FormulirKontak />

          {/* Right — info cards */}
          <div className="space-y-6">
            {/* Info Kontak */}
            <div className="bg-slate-50 rounded-2xl p-6">
              <h3 className="font-display font-bold text-lg text-slate-900 mb-5">Informasi Kontak</h3>
              <ul className="space-y-4">
                {KANAL_KONTAK.map((k, i) => (
                  <li key={i} className="flex gap-3 items-start">
                    <span className="text-xl flex-shrink-0 w-8 mt-0.5">{k.ikon}</span>
                    <div>
                      <div className="text-xs text-slate-500 mb-0.5">{k.label}</div>
                      <div className="text-sm font-medium text-slate-800">{k.nilai}</div>
                    </div>
                  </li>
                ))}
              </ul>
            </div>

            {/* Sosial Media */}
            <div className="bg-primary-900 text-white rounded-2xl p-6">
              <h3 className="font-display font-bold text-lg mb-2">Media Sosial</h3>
              <p className="text-primary-200 text-sm mb-5">
                Ikuti kami untuk mendapatkan informasi terbaru seputar TI Kesehatan.
              </p>
              <div className="grid grid-cols-2 gap-3">
                {['Twitter/X', 'LinkedIn', 'YouTube', 'Instagram'].map(s => (
                  <a
                    key={s}
                    href="#"
                    className="bg-white/10 rounded-xl p-3 text-center text-sm font-medium hover:bg-white/20 transition-colors justify-center min-h-0"
                  >
                    {s}
                  </a>
                ))}
              </div>
            </div>

            {/* Peta */}
            <div className="bg-slate-100 rounded-2xl h-48 flex flex-col items-center justify-center text-center px-6">
              <span className="text-4xl mb-3">📍</span>
              <div className="font-semibold text-slate-800 mb-1">Peta Lokasi Sekretariat</div>
              <div className="text-slate-500 text-sm">[Alamat Sekretariat]</div>
            </div>
          </div>
        </div>
      </section>
    );

    const FAQSection = ({ openIndex, setOpenIndex }) => (
      <section className="max-w-4xl mx-auto px-4 mt-20 mb-20">
        <h2 className="font-display font-bold text-2xl text-slate-900 text-center mb-8">
          Pertanyaan Umum (FAQ)
        </h2>
        <div>
          {FAQ_ITEMS.map((item, i) => (
            <div key={i} className="bg-white border border-slate-200 rounded-2xl mb-3 overflow-hidden">
              <button
                onClick={() => setOpenIndex(openIndex === i ? null : i)}
                className="w-full flex justify-between items-center px-6 py-4 text-left min-h-0"
              >
                <span className="font-semibold text-slate-900 pr-4">{item.q}</span>
                <span
                  className={`flex-shrink-0 text-slate-400 transition-transform duration-200 ${openIndex === i ? 'rotate-180' : ''}`}
                >
                  ▼
                </span>
              </button>
              <div
                className={`transition-all duration-300 overflow-hidden ${openIndex === i ? 'max-h-40' : 'max-h-0'}`}
              >
                <div className="px-6 pb-4 text-sm text-slate-600 leading-relaxed">{item.a}</div>
              </div>
            </div>
          ))}
        </div>
      </section>
    );

    const App = () => {
      const [openIndex, setOpenIndex] = useState(null);
      return (
        <div>
          <Header activePage="kontak.html" />
          <main>
            <PageHero />
            <KontakSection />
            <FAQSection openIndex={openIndex} setOpenIndex={setOpenIndex} />
          </main>
          <Footer />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
